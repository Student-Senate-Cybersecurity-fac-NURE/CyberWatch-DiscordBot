name: RSS Scheduled Sync

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: rss-scheduled
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  STATE_BRANCH: "rss-state"
  STATE_FILE: "state/rss_state.json"
  TZ: "Europe/Kyiv"

jobs:
  rss:
    name: Collect RSS And Persist State
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check state branch exists
        id: check_state_branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout state branch (if exists)
        if: steps.check_state_branch.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.STATE_BRANCH }}
          path: .rss-state
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persisted state files
        shell: bash
        run: |
          mkdir -p "$(dirname "$STATE_FILE")"

          if [ -f ".rss-state/$STATE_FILE" ]; then
            cp ".rss-state/$STATE_FILE" "$STATE_FILE"
          fi

      - name: Initialize state file if missing
        shell: bash
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from dateutil.tz import gettz

          kyiv_timezone = gettz("Europe/Kyiv") or gettz("Europe/Kiev")
          if kyiv_timezone is None:
            raise RuntimeError("Could not resolve timezone: Europe/Kyiv")

          state_path = Path("state/rss_state.json")
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state = {
            "schema_version": 2,
            "created_at_utc": datetime.now(kyiv_timezone)
            .replace(microsecond=0)
            .isoformat(),
            "last_successful_run_at_utc": None,
          }
          state_path.write_text(json.dumps(state, ensure_ascii=True, indent=2), encoding="utf-8")
          PY
          fi

      - name: Run RSS interval collector
        shell: bash
        env:
          WEBHOOK_PRIVATE_SECTOR_FEED: ${{ secrets.WEBHOOK_PRIVATE_SECTOR_FEED }}
          WEBHOOK_GOVERNMENT_FEED: ${{ secrets.WEBHOOK_GOVERNMENT_FEED }}
          WEBHOOK_STATUS_MESSAGES: ${{ secrets.WEBHOOK_STATUS_MESSAGES }}
        run: |
          python -m Source rss-sync

      - name: Update state metadata
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from dateutil.tz import gettz

          kyiv_timezone = gettz("Europe/Kyiv") or gettz("Europe/Kiev")
          if kyiv_timezone is None:
            raise RuntimeError("Could not resolve timezone: Europe/Kyiv")

          state_path = Path("state/rss_state.json")
          if state_path.exists():
            state = json.loads(state_path.read_text(encoding="utf-8"))
          else:
            state = {"schema_version": 2}

          state["last_successful_run_at_utc"] = (
            datetime.now(kyiv_timezone).replace(microsecond=0).isoformat()
          )
          state["updated_by_run_id"] = "${{ github.run_id }}"
          state_path.write_text(json.dumps(state, ensure_ascii=True, indent=2), encoding="utf-8")
          PY

      - name: Persist state to state branch
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RSS_STATE_REPO_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            GITHUB_TOKEN="${{ github.token }}"
          fi

          mkdir -p .rss-state

          if [ ! -d .rss-state/.git ]; then
            git -C .rss-state init
            git -C .rss-state checkout --orphan "$STATE_BRANCH"
            git -C .rss-state remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git -C .rss-state remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C .rss-state checkout -B "$STATE_BRANCH"
            git -C .rss-state pull --rebase origin "$STATE_BRANCH" || true
          fi

          mkdir -p ".rss-state/$(dirname "$STATE_FILE")"

          if [ -f "$STATE_FILE" ]; then
            cp "$STATE_FILE" ".rss-state/$STATE_FILE"
          fi

          git -C .rss-state config user.name "github-actions[bot]"
          git -C .rss-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .rss-state add "$STATE_FILE"

          if git -C .rss-state diff --cached --quiet; then
            echo "No state changes detected"
            exit 0
          fi

          git -C .rss-state commit -m "chore(rss-state): update rss state for run ${{ github.run_id }}"
          git -C .rss-state push --set-upstream origin "$STATE_BRANCH"

      - name: Upload runtime logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            logs/*.log
            state/rss_state.json